    { name = "alembic", specifier = ">=1.16.5" },
    { name = "black", marker = "extra == 'dev'", specifier = ">=23.0.0" },
    { name = "citelementtree", specifier = "~=1.2.7" },
    { name = "factory-boy", marker = "extra == 'dev'", specifier = ">=3.3.0" },
    { name = "factory-boy", marker = "extra == 'test'", specifier = ">=3.3.0" },
    { name = "faker", marker = "extra == 'dev'", specifier = ">=19.0.0" },
    { name = "faker", marker = "extra == 'test'", specifier = ">=19.0.0" },
    { name = "fastapi", specifier = ">=0.117.1" },
    { name = "fastapi-cache2", specifier = ">=0.2.2" },
    { name = "fastapi-users", specifier = ">=14.0.1" },
    { name = "fastapi-utils", specifier = ">=0.8.0" },
    { name = "flake8", marker = "extra == 'dev'", specifier = ">=6.0.0" },
    { name = "google-auth", specifier = ">=2.36.0" },
    { name = "google-auth-oauthlib", specifier = ">=1.2.1" },
    { name = "httpx", specifier = ">=0.28.1" },
    { name = "httpx", marker = "extra == 'dev'", specifier = ">=0.24.0" },
    { name = "httpx", marker = "extra == 'test'", specifier = ">=0.24.0" },
    { name = "lxml", specifier = ">=6.0.2" },
    { name = "mypy", marker = "extra == 'dev'", specifier = ">=1.5.0" },
    { name = "pbr", specifier = ">=7.0.1" },
    { name = "pydantic", specifier = ">=2.7.4" },
    { name = "pyjwt", specifier = ">=2.10.1" },
    { name = "pytest", marker = "extra == 'dev'", specifier = ">=7.4.0" },
    { name = "pytest", marker = "extra == 'test'", specifier = ">=7.4.0" },
    { name = "pytest-asyncio", marker = "extra == 'dev'", specifier = ">=0.21.0" },
    { name = "pytest-asyncio", marker = "extra == 'test'", specifier = ">=0.21.0" },
    { name = "pytest-cov", marker = "extra == 'dev'", specifier = ">=4.1.0" },
    { name = "pytest-cov", marker = "extra == 'test'", specifier = ">=4.1.0" },
    { name = "python-dateutil", specifier = ">=2.9.0.post0" },
    { name = "python-dotenv", specifier = ">=1.1.1" },
    { name = "python-ffmpeg-video-streaming", specifier = ">=0.1.16" },
    { name = "redis", specifier = ">=6.4.0" },
    { name = "requests", specifier = ">=2.32.5" },
    { name = "semver", specifier = ">=3.0.4" },
    { name = "sqlalchemy", specifier = ">=2.0.43" },
    { name = "sqlalchemy-stubs", specifier = ">=0.4" },
    { name = "typing-inspect", specifier = ">=0.9.0" },
    { name = "uvicorn", specifier = ">=0.37.0" },
    { name = "xdg-base-dirs", specifier = ">=6.0.2" },
]
provides-extras = ["test", "dev"]

[package.metadata.requires-dev]
dev = [
    { name = "factory-boy", specifier = ">=3.3.3" },
    { name = "pytest-asyncio", specifier = ">=1.2.0" },
    { name = "pytest-cov", specifier = ">=7.1.0" },
]
